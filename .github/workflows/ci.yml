name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build library + sample (Desktop JVM)
        run: |
          ./gradlew --no-daemon \
            :library:compileKotlinDesktop \
            :sample:compileKotlinDesktop \
            -Pcmpioschrome.android=false \
            -Pcmpioschrome.ios=false
      # iOS compile/link requires macOS + Xcode — not run here.
